name: Verify frontend and Java backend
on:
  pull_request:
  push:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run build
        env:
          API_INTERNAL_URL: http://backend:8080
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sohrab_test
          POSTGRES_USER: sohrab
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sohrab -d sohrab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn --batch-mode verify
        env:
          INTEGRATION_DB_URL: jdbc:postgresql://localhost:5432/sohrab_test
  smoke:
    runs-on: ubuntu-latest
    env:
      SITE_DOMAIN: localhost
      DATABASE_PASSWORD: integration-password
      OWNER_LOGIN: owner
      OWNER_PASSWORD: integration-secret-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d database backend frontend
      - name: Check website and API through frontend
        run: |
          for attempt in $(seq 1 40); do
            if docker compose exec -T frontend node -e "fetch('http://localhost:3000/api/health').then(r=>r.json()).then(x=>process.exit(x.status==='ok'?0:1)).catch(()=>process.exit(1))"; then
              docker compose exec -T frontend node -e "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
              exit $?
            fi
            sleep 3
          done
          docker compose logs --tail=100 database backend frontend
          exit 1
      - if: always()
        run: docker compose down

